<!doctype html>
<html lang="en">
<head>

<title>featherweight</title>
<style>
/* A calm workbench: neutral colors and one accent. A status always has a
   word or an icon, so color is never the only signal. */
:root {
  --canvas: #f5f5f7; --surface: #fff; --fill: #ececef; --ink: #1d1d1f; --ink2: #6b6b70; --hair: rgba(60,60,67,.16);

:root[data-theme="dark"] {
  --canvas: #000; --surface: #1c1c1e; --fill: #2c2c2e; --ink: #f5f5f7; --ink2: #a1a1a6; --hair: rgba(84,84,88,.6);
  --tint: #4ea1ff; --bubble: #262629; --chev: #5a5a5e; --quiet: #8e8e93; --need: #f5a524; --ok: #3ccf6e; --bad: #ff6b61; --add: #30d158; --del: #ff453a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #000; --surface: #1c1c1e; --fill: #2c2c2e; --ink: #f5f5f7; --ink2: #a1a1a6; --hair: rgba(84,84,88,.6);
    --tint: #4ea1ff; --bubble: #262629; --chev: #5a5a5e; --quiet: #8e8e93; --need: #f5a524; --ok: #3ccf6e; --bad: #ff6b61; --add: #30d158; --del: #ff453a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }

a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.app.split { display: grid; grid-template-columns: 360px minmax(0, 1fr); }

.side .screen { padding: 0 16px 24px; }

  background: color-mix(in srgb, var(--canvas) 86%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }

.brand svg { width: 22px; height: 22px; }
.tabs { flex: 1; display: flex; gap: 2px; }

  background: color-mix(in srgb, var(--canvas) 86%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }

.back { justify-self: start; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: var(--tint); background: none; border: 0; padding: 8px 6px; cursor: pointer; font-size: 17px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back span { overflow: hidden; text-overflow: ellipsis; }

.glance { font: 600 20px/26px var(--font); letter-spacing: -.012em; margin: 18px 0 4px; text-wrap: balance; }

.sub { font-size: 13px; line-height: 18px; color: var(--ink2); margin: 16px 0 6px 16px; }
.sec + .sub { margin-top: 0; }
.group { background: var(--surface); border-radius: 12px; overflow: hidden; }
.group + .group { margin-top: 12px; }

.row + .row::before, .field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--hair); }

.row.sel, .row.sel:hover { background: color-mix(in srgb, var(--tint) 13%, transparent); }

.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { display: block; font-size: 13px; line-height: 18px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .end { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 13px; white-space: nowrap; }
.row.danger .t { color: var(--bad); font-weight: 400; }
.row.kv { cursor: default; align-items: flex-start; } .row.kv .end { white-space: normal; text-align: right; max-width: 62%; font-size: 15px; line-height: 21px; overflow-wrap: anywhere; }
.row.link .t { color: var(--tint); font-weight: 400; }
.row.can { cursor: default; } .row.can .s { white-space: normal; }

.st { white-space: nowrap; }

.chev { width: 8px; height: 13px; color: var(--chev); flex: none; }
.btn { appearance: none; border: 0; border-radius: 999px; padding: 7px 16px; min-height: 36px; font-weight: 600; background: var(--fill); color: var(--tint); cursor: pointer; white-space: nowrap; }

.btn.danger { color: var(--bad); }

.result { padding: 4px 0 0; }

.status { margin: 0; font-size: 13px; line-height: 20px; color: var(--ink2); }

#decision:not(:empty), #outcome:not(:empty) { margin-top: 16px; }
.summary { background: var(--surface); border-radius: 12px; padding: 13px 16px; overflow-wrap: anywhere; }

.summary ul, .summary ol, .say ul, .say ol { padding-left: 22px; }

.summary pre, .say pre { font: 12.5px/18px var(--mono); border-radius: 8px; padding: 8px 10px; margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 14em; overflow: auto; }
.summary pre { background: var(--fill); } .say pre { background: var(--surface); }
.summary pre code, .say pre code { background: none; padding: 0; font-size: inherit; }
.lbl { font: 600 13px/18px var(--font); color: var(--ink2); margin: 18px 0 6px 4px; }

.decide.question { box-shadow: 0 0 0 1px color-mix(in srgb, var(--tint) 35%, transparent); }

  const always = !!(run.member && d.tool && (d.reason === 'default' || /^rule: ask /.test(d.reason || ''))
    && !/^rule: ask (readonly|read-only|idempotent|destructive|parallel|parallelsafe)$/i.test(d.reason || ''));
  let raw = '';
  try { raw = d.input == null ? '' : JSON.stringify(typeof d.input === 'string' ? JSON.parse(d.input) : d.input, null, 2); } catch (e) { raw = String(d.input); }
  return `<div class="decide" data-ask="${esc(d.id)}" data-key="ask:${esc(d.id)}">
    <p class="kick">Permission</p><h3>${esc(decisionTitle(agent, d))}</h3>
    ${effect ? `<p class="effect">${esc(effect)}</p>` : ''}
    ${change ? `<pre class="code">${change}</pre>` : ''}
    ${why ? `<p class="why">${esc(why)}</p>` : ''}
    <details class="more"><summary>Details</summary>${d.tool ? `<p>Tool: <code>${esc(d.tool)}</code></p>` : ''}${rule ? `<p>${esc(cap(d.reason))}</p>` : ''}${raw ? `<pre class="code">${esc(raw)}</pre>` : ''}</details>
    <form data-form="decide" data-id="${esc(run.id)}" data-approval="${esc(d.id)}">
      <div class="do"><button class="btn" type="submit" value="deny" formnovalidate>Deny</button>${always ? `<button class="btn" type="submit" value="rule" title="Allow this call, and let ${esc(agent)} use ${esc(d.tool)} from now on without asking">Always allow</button>` : ''}<button class="btn primary" type="submit" value="allow">${esc(d.label || 'Allow')}</button></div>
    </form></div>`;
}
// connectCard asks the person to connect the service that the run waits
// for. Connect opens the sign-in of the service, and the run goes on when
// it ends. Skip lets the run go on without the service. A connection is no
// permission, so the card has no Allow.
function connectCard(run, d) {
  const c = d.connect, title = connectTitle(c), agent = runName(run);
  const head = c.reason === 'expired' ? `Sign in to ${title} again` : `Connect ${title}`;
  const text = c.reason === 'expired' ? `${agent} needs your sign-in at ${title} to go on acting as you there.` : `${agent} wants to act as you in ${title}.`;
  return `<div class="decide connect" data-ask="${esc(d.id)}" data-key="ask:${esc(d.id)}">
    <p class="kick">Connection</p><h3>${esc(head)}</h3><p class="effect">${esc(text)}</p>
    <p class="why">You sign in at ${esc(title)}. You can disconnect it at any time in Connections.</p>
    <div class="do"><button class="btn" type="button" data-action="skip" data-id="${esc(run.id)}" data-approval="${esc(d.id)}">Skip</button><button class="btn primary" type="button" data-action="connect" data-server="${esc(c.server)}" data-run="${esc(run.id)}">Connect</button></div></div>`;
}
// openConnect starts the connection of a service. In a browser, the page
// goes to the sign-in of the service, which comes back to next. Inside a
// host, the host opens the address. When the host cannot, the link shows
// under the button.
async function openConnect(server, next, el) {
  const r = await api.connect(server, next);
  if (S.mode !== 'mcp') { location.assign(r.url); return; }
  try { await bridge.request('ui/open-link', {url: r.url}, 5000); } catch (e) {
    const box = el && (el.closest('.decide, .solo, .group, .row-wrap') || el.parentElement);
    if (!box || $('.link-note', box.parentElement)) return;
    box.insertAdjacentHTML('afterend', `<p class="link-note">Your host did not open the sign-in. Open it here: <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc('Connect ' + server)}</a></p>`);
  }
}
// outcomeHTML is what a run produced: the answer, the files that changed,
// what it did, its limits, and the next actions. A run that works shows
// none of it, so the conversation stays first.
function outcomeHTML(run, res) {
  // The proposal card in the conversation is the result of the builder.
  if (!res || isBuilder(run)) return '';
  const st = res.status || statusOf(run);
  if (st === 'working' || st === 'needs-you') return '';
  let h = '';
  // A person cancels a run on purpose, so only a failure gets the note. A
  // limit says the same in plain words, so it replaces a budget error.
  const limited = (res.limits || []).length && /^budget exceeded/i.test(res.error || '');
  if (res.error && st === 'failed' && !limited) h += `<p class="err-note">${esc(cap(res.error))}</p>`;
  if (res.summary) h += `<div class="summary">${md(res.summary)}</div>`;
  const files = res.files || [];
  if (files.length) {
    h += `<h3 class="lbl">Files changed</h3><div class="files" style="max-width:none">${files.map(f => {
      const name = f.path.split('/').pop(), dir = f.path.slice(0, -name.length - 1);
      return `<button class="file${f.op === 'removed' ? ' gone' : ''}" data-action="file" data-id="${esc(run.id)}" data-path="${esc(f.path)}">${svg.doc}<span class="fn"><b>${esc(name)}</b>${dir ? `<small>${esc(dir)}</small>` : ''}</span><span class="fo">${esc(OPS[f.op] || cap(f.op))}${f.size ? ', ' + esc(bytes(f.size)) : ''}</span>${svg.chev}</button>`;
    }).join('')}</div>`;
  }
  const steps = res.steps || [];
  if (steps.length) {
    // Each step is a recorded outcome. Done says that the call returned, not
    // that a check passed.
    const errs = steps.filter(x => x.isError).length;
    const word = x => x.isError ? 'Error' : x.done ? 'Done' : 'No result';
    const icon = x => x.isError ? ICON.failed : x.done ? '<circle cx="5" cy="5" r="3" fill="currentColor"/>' : ICON.ended;
    h += `<details class="did"><summary>${svg.chev}<b>What it did</b><span>${steps.length === 1 ? '1 step' : steps.length + ' steps'}${errs ? ', ' + (errs === 1 ? '1 error' : errs + ' errors') : ''}</span></summary>
      <ol>${steps.map(x => `<li class="${x.isError ? 'err' : ''}"><svg viewBox="0 0 10 10" aria-hidden="true">${icon(x)}</svg><span>${esc(x.text)}</span><small>${word(x)}</small></li>`).join('')}</ol></details>`;
  }
  if ((res.limits || []).length) h += `<h3 class="lbl">Limits</h3><ul class="limits">${res.limits.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
  const next = (res.next || []).filter(n => n.kind !== 'decide' && n.kind !== 'answer' && n.kind !== 'connect');
  if (next.length) h += `<div class="next">${next.map((n, i) => `<button class="btn${i === 0 ? ' primary' : ''}" data-action="next" data-kind="${esc(n.kind)}">${esc(n.label)}</button>`).join('')}</div>`;
  return h;
}

// PAGE is the number of events that one page of a conversation reads.
const PAGE = 120;

screens.run = {
  async open(s, el, dir) {
    // A run opens at its recent end: the last page of its events. Earlier
    // pages load above the chat when the person asks for them.
    const page = await api.items(s.id, {limit: PAGE});
    if (top() !== s) return; // the person left the screen while it loaded
    const run = page.run;
    s.title = workTitle(run);
    const ctx = {id: s.id, run, cursor: 0, prev: page.prev || 0, group: null, el, idle: false, lastAt: 0, rkey: '', rn: 0, res: null, helpers: [], decided: '', orphans: []};
    const end = `<button class="btn plain" data-action="cancel" data-id="${esc(s.id)}" id="cancel"${isActive(run) ? '' : ' hidden'}>Cancel</button>`;
    mount(el, bar(s, end, true) + alert() + `<section class="result" aria-label="Result">
        <h1 class="work" id="work-title">${esc(s.title)}</h1><p class="status" id="status"></p><div id="decision"></div><div id="outcome"></div></section>
      <h2 class="sec conv">Conversation</h2>
      <div class="earlier" id="earlier"${ctx.prev ? '' : ' hidden'}><button class="btn small" type="button" data-action="earlier">Load earlier messages</button></div>
      <div class="chat" id="chat"></div><div id="kids"></div>
      <details class="activity" id="activity"><summary>${svg.chev}Activity</summary><ol class="evl"></ol></details>
      <div class="composer" id="composer"><div class="pinned" id="pinned"></div><form data-form="send" data-id="${esc(s.id)}" data-draft="run:${esc(s.id)}">
        <button class="attach" type="button" data-action="attach" aria-label="Attach files">${svg.plus}</button>
        <div class="pill"><div class="tray" id="tray"></div><div class="line">
          <textarea name="content" rows="1" aria-label="Message" placeholder="${isBuilder(run) ? 'Describe a change' : 'Message ' + esc(run.agent)}"></textarea>
          <button class="send" type="submit" aria-label="Send" data-send disabled>${svg.send}</button></div></div>
        <input type="file" name="pick" multiple hidden></form></div>`, dir).classList.add('talk');
    S.run = ctx;
    this.apply(ctx, page);
    // The next poll reads the events after the run as it was read.
    ctx.cursor = Math.max(ctx.cursor, (run.seq || 0) + 1);
    restoreDraft($('form[data-form="send"]', el));
    this.kids(ctx).catch(() => {});
    // A run that works and a builder conversation open at their end, where
    // the agent writes. Any other run opens at its result.
    window.scrollTo(0, statusOf(run) === 'working' || isBuilder(run) ? document.body.scrollHeight : 0);
    // poll reads the items after the last one. A send or a decision calls
    // it at once, so the chat shows the change without a pop-up.
    ctx.poll = async () => {
      const next = await api.items(ctx.id, {from: ctx.cursor});
      if (S.run !== ctx) return;
      this.apply(ctx, next);
      ctx.idle = !isActive(next.run) && !next.next;
    };
    every(2000, async () => {
      if (!ctx.idle) return ctx.poll();
      // A model can write the title of a run after it finishes. For two
      // minutes after the finish, the run is read every ten seconds, and
      // only its title changes on the screen.
      ctx.doneAt = ctx.doneAt || Date.parse(ctx.run.updatedAt) || Date.now();
      if (Date.now() - ctx.doneAt > 120000 || Date.now() - (ctx.titleAt || 0) < 10000) return;
      ctx.titleAt = Date.now();
      const page = await api.items(ctx.id, {from: ctx.cursor, limit: 1});
      if (S.run === ctx && page.run) this.title(ctx, workTitle(page.run));
    });
  },
  apply(ctx, page) {
    const chat = $('#chat', ctx.el);
    if (!chat) return;
    const stick = window.innerHeight + window.scrollY >= document.body.scrollHeight - 60;
    const items = page.items || [];
    for (const it of items) if (it.seq >= ctx.cursor) this.add(ctx, chat, it);
    ctx.cursor = page.next || Math.max(ctx.cursor, ...items.map(it => it.seq + 1));
    const run = page.run || ctx.run;
    ctx.run = run;
    this.title(ctx, workTitle(run));
    const c = $('#cancel', ctx.el); if (c) c.hidden = !isActive(run);
    // While the agent works, a typing bubble ends the chat, as in Messages.
    const working = run.state === 'queued' || run.state === 'running';
    const typing = $('#typing', chat);
    if (working && !typing) chat.insertAdjacentHTML('beforeend', '<div class="typing" id="typing" role="status" aria-label="The agent is working"><i></i><i></i><i></i></div>');
    else if (!working && typing) typing.remove();
    this.status(ctx);
    // The result changes with the state, the pending decision, and, once
    // the run stops, each new event.
    const key = [run.state, run.pending ? run.pending.id : '', isActive(run) ? '' : run.seq].join('|');
    if (key !== ctx.rkey) { ctx.rkey = key; this.result(ctx).catch(fail); }
    if (stick && items.length) window.scrollTo(0, document.body.scrollHeight);
  },
  // title shows a new title, such as the one that a model writes a few
  // seconds after the start, in the heading, the bar, and the back button.
  title(ctx, t) {
    const h = $('#work-title', ctx.el), b = $('.bar .title', ctx.el);
    if (!t || !h || h.textContent === t) return;
    h.textContent = t;
    if (b) b.textContent = t;
    const s = S.stack.find(x => x.view === 'run' && x.id === ctx.id);
    if (s) s.title = t;
  },
  // status draws the quiet line under the title: the agent, the status, the
  // time, the helpers, the member, and the person who started it.
  status(ctx) {
    const run = ctx.run, el = $('#status', ctx.el);
    if (!el) return;
    const st = ctx.res && ctx.resState === run.state && ctx.res.status ? ctx.res.status : statusOf(run);
    const agent = isBuilder(run) ? ''
      : `<button class="agent-link" data-action="agent" data-name="${esc(run.agent)}" data-member="${esc(run.member || '')}" aria-label="${esc(run.agent)}. Open the agent">${face(run.agent, 16)}${esc(run.agent)}</button>`;
    const h = ctx.helpers;
    const text = [esc(timeWords(run, st)),
      h.length ? 'with ' + esc(h.length > 2 ? h.slice(0, 2).join(', ') + ' and ' + (h.length - 2) + ' more' : h.join(' and ')) : '',
      run.member ? 'on ' + esc(run.member) : '', run.principal && me() && run.principal !== me() ? 'by ' + esc(who(run.principal)) : ''];
    const html = `<span class="parts">${[agent, badge(st)].filter(Boolean).concat(text.filter(Boolean)).map(x => `<span>${x}</span>`).join('')}</span>`;
    // The face makes new markup each time, so the key leaves it out.
    const key = html.replace(/<span class="face"[\s\S]*?<\/svg><\/span>/g, '');
    if (el.dataset.key !== key) { el.dataset.key = key; morph(el, html); }
  },
  // result reads the result of the run, then draws the decision that waits
  // and what the run produced. A fleet member without the result route
  // gets the decision from the run.
  async result(ctx) {
    const n = ++ctx.rn;
    let res = null;
    try { res = await api.result(ctx.id); } catch (e) { if (e && e.signin) throw e; res = null; }
    if (S.run !== ctx || n !== ctx.rn) return;
    ctx.res = res; ctx.resState = ctx.run.state;
    if (res && res.title) this.title(ctx, res.title);
    this.status(ctx);
    const d = res ? res.pending || null : decisionOf(ctx.run);
    this.decision(ctx, d && d.id !== ctx.decided ? d : null);
    const out = $('#outcome', ctx.el), html = outcomeHTML(ctx.run, res);
    if (out && out.dataset.key !== html) { out.dataset.key = html; morph(out, html); }
  },
  // decision draws the card of the decision that waits. The same decision
  // keeps its card and changes in place, so a form that the person fills
  // in stays as it is. The bar above the composer points to the card while
  // its buttons are out of view.
  decision(ctx, d) {
    const box = $('#decision', ctx.el), pin = $('#pinned', ctx.el);
    if (!box) return;
    const cur = $('.decide', box);
    if (d && cur && cur.dataset.ask === d.id) { morph(box, decisionCard(ctx.run, d)); return; }
    if (!d && !cur) return;
    box.innerHTML = d ? decisionCard(ctx.run, d) : '';
    if (ctx.io) { ctx.io.disconnect(); ctx.io = null; }
    pin.innerHTML = '';
    const form = $('.decide form', box) || $('.decide .do', box);
    if (!form || !('IntersectionObserver' in window)) return;
    pin.innerHTML = `<button class="jump" type="button" data-action="to-decision" hidden><svg viewBox="0 0 10 10" aria-hidden="true">${ICON['needs-you']}</svg>${esc(runName(ctx.run))} ${d.connect ? 'waits for you to connect ' + esc(connectTitle(d.connect)) : d.question ? 'waits for your answer' : 'waits for your decision'}</button>`;
    ctx.io = new IntersectionObserver(([e]) => { const j = $('.jump', pin); if (j) j.hidden = e.isIntersecting; });
    ctx.io.observe(form);
  },
  // older loads the page of items in front of the chat and puts it above,
  // with its own state, then keeps the item that the person reads where it
  // was on the screen.
  async older(ctx) {
    if (!ctx || !ctx.prev || ctx.loadingOlder) return;
    ctx.loadingOlder = true;
    try {
      const page = await api.items(ctx.id, {before: ctx.prev, limit: PAGE});
      if (S.run !== ctx) return;
      const chat = $('#chat', ctx.el), box = document.createElement('div');
      const sub = {id: ctx.id, run: ctx.run, el: ctx.el, group: null, lastAt: 0, prev: page.prev || 0, orphans: ctx.orphans, helpers: [], kidsSoon: true};
      for (const it of page.items || []) this.add(sub, box, it);
      // The anchor is the first item on the screen. A time line can go, so
      // it is no anchor.
      const anchor = [...chat.children].find(n => !n.classList.contains('when') && n.getBoundingClientRect().bottom > 0);
      const y = anchor ? anchor.getBoundingClientRect().top : 0;
      const first = chat.firstElementChild;
      document.documentElement.style.overflowAnchor = 'none';
      chat.prepend(...box.childNodes);
      // A time line that follows the new items closely is one too many.
      if (first && first.classList.contains('when') && sub.lastAt && +first.dataset.at - sub.lastAt < 15 * 60000) first.remove();
      ctx.prev = page.prev || 0;
      $('#earlier', ctx.el).hidden = !ctx.prev;
      if (anchor) window.scrollBy(0, anchor.getBoundingClientRect().top - y);
      requestAnimationFrame(() => { document.documentElement.style.overflowAnchor = ''; });
      // The results whose calls were on this page find them now.
      ctx.replaying = true;
      for (const it of ctx.orphans.splice(0)) this.add(ctx, chat, it);
      ctx.replaying = false;
      const drafts = chat.querySelectorAll('.draft:not([hidden])');
      drafts.forEach((x, i) => x.classList.toggle('old', i < drafts.length - 1));
      this.kids(ctx).catch(() => {});
    } finally { ctx.loadingOlder = false; }
  },
  add(ctx, chat, it) {
    // put adds html before the typing bubble and returns the new element.
    // A result that comes back to its call goes right after the call.
    const put = (html, keep, after) => {
      if (!keep) ctx.group = null;
      if (after) { after.insertAdjacentHTML('afterend', html); return after.nextElementSibling; }
      const t = $('#typing', chat);
      if (t) { t.insertAdjacentHTML('beforebegin', html); return t.previousElementSibling; }
      chat.insertAdjacentHTML('beforeend', html);
      return chat.lastElementChild;
    };
    // An item whose call is on an earlier page waits for that page.
    const orphan = () => { if (ctx.prev) ctx.orphans.push(it); return null; };
    // A time line opens the chat and every pause of 15 minutes or more.
    const when = () => {
      const at = new Date(it.time).getTime();
      if (!ctx.lastAt || at - ctx.lastAt >= 15 * 60000) put(`<p class="when" data-at="${at}">${whenWords(it.time)}</p>`, true);
      ctx.lastAt = at;
    };
    const step = id => id ? chat.querySelector(`.step[data-call="${CSS.escape(id)}"]`) : null;
    // A question of ask_user is a message of the agent, and the answer is a
    // message of the person, as in Messages. The card in the result asks.
    const question = id => id ? chat.querySelector(`.say[data-call="${CSS.escape(id)}"]`) : null;
    switch (it.kind) {
      case 'user': {
        when();
        if (it.who && S.me && S.me.principal && it.who !== S.me.principal.subject) put(`<p class="who">${esc(it.who)}</p>`);
        if (it.files && it.files.length) loadPics(ctx.id, put(attHTML(ctx.id, it.files)));
        return it.text ? put(`<div class="mine">${esc(it.text)}</div>`) : null;
      }
      case 'assistant': when(); return put(`<div class="say">${md(it.text)}</div>`);
      case 'tool': {
        if (it.tool === 'spawn_task') {
          const d = obj(it.input) || {}; // a cut input names no helper
          const helper = d.agent || 'default';
          const el = put(`<button class="hand" data-call="${esc(it.callId)}" data-helper="${esc(helper)}">${face(helper, 20)}<span>Asked ${esc(helper)}: ${esc(firstLine(d.input))}</span></button>`);
          el.dataset.input = String(d.input || '');
          if (!ctx.kidsSoon) ctx.kidsSoon = setTimeout(() => { ctx.kidsSoon = null; this.kids(ctx).catch(() => {}); }, 300);
          return el;
        }
        if (it.tool === 'propose_agent') {
          // The server makes the profile of the proposal. The card shows
          // once the tool accepts it. A field without a value stays out.
          if (!it.profile) return null;
          const el = put(`<div class="draft" data-call="${esc(it.callId)}" hidden></div>`);
          el.dataset.profile = JSON.stringify(clean(it.profile));
          return el;
        }
        if (it.tool === 'ask_user') {
          const q = (obj(it.input) || {}).question || ''; // a cut input shows no question
          ctx.group = null;
          when();
          return q ? put(`<div class="say" data-call="${esc(it.callId)}">${md(q)}</div>`) : null;
        }
        if (!ctx.group) ctx.group = put('<details class="steps"><summary></summary></details>');
        ctx.group.insertAdjacentHTML('beforeend', `<div class="step" data-call="${esc(it.callId)}" data-allow="${esc(allowWords(it.input))}"><header>${esc(stepWords(it.tool, it.input))}<span>Running</span></header>${it.input ? `<pre class="io">${preview(it.input, true)}</pre>` : ''}</div>`);
        return this.sum(ctx.group);
      }
      case 'result': {
        const hand = it.callId ? chat.querySelector(`.hand[data-call="${CSS.escape(it.callId)}"]`) : null;
        if (hand) {
          const helper = hand.dataset.helper, at = ctx.replaying ? hand : null;
          // A child that works in the background answers through await_task.
          if (/^Started child run /.test(it.text || '')) return null;
          if (it.isError) return put(`<p class="cap err">${esc(helper)} did not finish. ${esc(it.text || '')}</p>`, true, at);
          const name = put(`<p class="who them">${esc(helper)}</p>`, false, at);
          return put(`<div class="from">${face(helper, 28)}<div class="say">${md(it.text || '')}</div></div>`, false, at ? name : null);
        }
        const dr = it.callId ? chat.querySelector(`.draft[data-call="${CSS.escape(it.callId)}"]`) : null;
        if (dr) {
          if (it.isError) { dr.remove(); return null; }
          chat.querySelectorAll('.draft').forEach(x => { if (x !== dr) x.classList.add('old'); });
          dr.hidden = false;
          fillDraft(dr).catch(e => { dr.innerHTML = `<p class="err">${esc(e.message)}</p>`; });
          return dr;
        }
        const q = question(it.callId);
        if (q) {
          if (it.isError) return null;
          const at = ctx.replaying ? q : null;
          const by = q.dataset.who && q.dataset.who !== me() ? put(`<p class="who">${esc(q.dataset.who)}</p>`, false, at) : null;
          let titles = {};
          try { titles = JSON.parse(q.dataset.titles || '{}'); } catch (e) { /* keys name the fields */ }
          return put(`<div class="mine">${esc(answerText(it.text, titles))}</div>`, false, at ? by || q : null);
        }
        const el = step(it.callId);
        if (!el) return orphan();
        el.classList.toggle('err', !!it.isError);
        const st = $('header span', el);
        if (!/^(Denied|Skipped)/.test(st.textContent)) st.textContent = it.isError ? 'Failed' : 'Done';
        if (it.text) el.insertAdjacentHTML('beforeend', `<pre class="io${it.isError ? ' err' : ''}">${esc(it.text)}</pre>`);
        return this.sum(el.closest('.steps'));
      }
      case 'file': {
        const el = step(it.callId);
        const group = el ? el.closest('.steps') : ctx.group;
        let box = group && group.nextElementSibling;
        if (!box || !box.classList.contains('files')) {
          if (group) { group.insertAdjacentHTML('afterend', '<div class="files"></div>'); box = group.nextElementSibling; }
          else box = put('<div class="files"></div>', true);
        }
        return fileRow(ctx.id, box, it);
      }
      case 'ask': {
        const q = question(it.callId);
        if (q) {
          q.dataset.ask = it.id;
          q.dataset.titles = JSON.stringify(Object.fromEntries((formOf(it.schema) || []).map(f => [f.key, f.title])));
          return null;
        }
        const el = step(it.callId);
        if (el) {
          $('header span', el).textContent = 'Waiting for you';
          el.dataset.ask = it.id;
          if (it.connect) el.dataset.connect = connectTitle(it.connect);
          return this.sum(el.closest('.steps'));
        }
        // The card in the result shows the decision, so the chat adds none.
        return orphan();
      }
      case 'decided': {
        const q = chat.querySelector(`.say[data-ask="${CSS.escape(it.id || '')}"]`);
        if (q) {
          q.dataset.who = it.who || '';
          return it.text === 'allow' ? null : put(`<p class="cap">${esc(it.who && it.who !== me() ? it.who + ' declined to answer' : 'You declined to answer')}</p>`, true, ctx.replaying ? q : null);
        }
        const el = chat.querySelector(`.step[data-ask="${CSS.escape(it.id || '')}"]`);
        // A connect ends as Connected or Skipped, not as a permission.
        const conn = it.connect || (el && el.dataset.connect);
        const by = it.who && it.who !== me() ? ' by ' + it.who : '';
        const word = conn ? (it.text === 'allow' ? 'Connected' : 'Skipped') + by : (it.text === 'allow' ? 'Allowed' : 'Denied') + (it.who ? ' by ' + it.who : '');
        if (conn && !el) {
          const line = (it.text === 'allow' ? 'Connected ' : 'Skipped ') + (typeof conn === 'string' ? conn : connectTitle(conn)) + by;
          return ctx.prev ? orphan() : ctx.replaying ? null : put(`<p class="cap">${esc(line)}</p>`, true);
        }
        if (el) { $('header span', el).textContent = word; return this.sum(el.closest('.steps')); }
        if (ctx.prev) return orphan();
        return ctx.replaying ? null : put(`<p class="cap">${esc(word + (it.detail ? '. ' + it.detail : ''))}</p>`, true);
      }
      case 'tools': {
        // A run that an inline profile gives more tools than its agent has
        // says so under the first message. The builder gets its own tool.
        if (isBuilder(ctx.run)) return null;
        const names = (it.text || '').split(',').filter(Boolean);
        const el = put(`<p class="cap notice">${esc(extraText(ctx.run.agent, names))}</p>`, true);
        if (!ctx.run.member) api.agent(ctx.run.agent).then(a => { el.textContent = extraText(ctx.run.agent, names, a.abilities); }).catch(() => {});
        return el;
      }
      case 'note': {
        const t = $('#typing', chat), last = t ? t.previousElementSibling : chat.lastElementChild;
        if (last && last.classList.contains('cap') && last.textContent === it.text) return;
        return put(`<p class="cap${it.isError ? ' err' : ''}">${esc(it.text)}</p>`, true);
      }
      case 'end': {
        // A turn that finished needs no line, as in Messages. A failed or a
        // canceled turn says so.
        if (it.text === 'completed' && !it.isError) return null;
        const word = {completed: 'Finished', failed: 'Failed', canceled: 'Canceled'}[it.text] || cap(it.text);
        const at = new Date(it.time).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
        return put(`<p class="cap${it.isError ? ' err' : ''}">${esc(word)} at ${esc(at)}${it.detail && it.detail !== it.text ? '. ' + esc(it.detail) : ''}</p>`);
      }
    }
  },
  // sum words a group of steps without tool names, in the words of the
  // decision card: "Waits for you to allow a command", "Working on a
  // step", or "Took 3 steps".
  sum(group) {
    const steps = [...group.querySelectorAll('.step')];
    const word = s => $('header span', s).textContent;
    const count = (n, one) => n === 1 ? one : n + ' steps';
    const waiting = steps.filter(s => word(s) === 'Waiting for you');
    let text;
    if (waiting.length === 1 && waiting[0].dataset.connect) text = 'Waits for you to connect ' + waiting[0].dataset.connect;
    else if (waiting.length) text = 'Waits for you to allow ' + (waiting.length === 1 ? waiting[0].dataset.allow || 'this step' : waiting.length + ' steps');
    else if (steps.some(s => word(s) === 'Running')) text = 'Working on ' + count(steps.length, 'a step');
    else {
      const denied = steps.filter(s => /^Denied/.test(word(s))).length, skipped = steps.filter(s => /^Skipped/.test(word(s))).length;
      const failed = steps.filter(s => s.classList.contains('err') && !/^(Denied|Skipped)/.test(word(s))).length;
      text = 'Took ' + count(steps.length, '1 step') + (failed ? `, ${failed} failed` : '') + (denied ? `, ${denied} denied` : '') + (skipped ? `, ${skipped} skipped` : '');
    }
    $('summary', group).innerHTML = svg.chev + esc(text);
  },
  // kids links each handoff in the chat to its child run, by agent and task,
  // names the helpers in the status line, and lists the child runs that no
  // handoff shows.
  async kids(ctx) {
    const r = await api.runs({parent: ctx.id, limit: 50});
    if (S.run !== ctx) return;
    const kids = (r.runs || []).filter(k => k.parent === ctx.id).sort((x, y) => String(x.createdAt).localeCompare(String(y.createdAt)));
    const left = [...kids];
    for (const h of ctx.el.querySelectorAll('.hand')) {
      const i = left.findIndex(k => k.id === h.dataset.id || (!h.dataset.id && k.agent === h.dataset.helper && k.input === h.dataset.input));
      if (i < 0) continue;
      h.dataset.action = 'run';
      h.dataset.id = left[i].id;
      left.splice(i, 1);
    }
    ctx.helpers = [...new Set(kids.map(k => k.agent))];
    this.status(ctx);
    const el = $('#kids', ctx.el);
    if (el) morph(el, left.length ? `<h2 class="sec">Subtasks</h2><div class="group">${left.map(runRow).join('')}</div>` : '');
  },
};

// face draws the face of an agent, as a contact has a picture: a circle in
// two colors with eyes and a mouth. A hash of the name picks each part, so
// an agent keeps its face everywhere, and two agents rarely share one.
let faceSeq = 0;
function face(name, size) {
  let h = 2166136261;
  for (const ch of String(name || '?')) h = Math.imul(h ^ ch.codePointAt(0), 16777619) >>> 0;
  let x = h || 1;
  const pick = n => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x % n; };
  // Calm hues, as the system colors: blue, indigo, purple, pink, red,
  // orange, teal, cyan, and green. Greens and cyans go a little deeper, so
  // the white face keeps its contrast.
  const HUES = [205, 228, 252, 276, 300, 330, 352, 16, 172, 190, 148];
  const hue = HUES[pick(HUES.length)], hue2 = hue + 10 + pick(18), deep = hue > 140 && hue < 200 ? 6 : 0;
  const gap = 9 + pick(4), ey = 26 + pick(4), my = 40 + pick(3);
  const W = 'fill="#fff"', L = 'fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"';
  const eyes = pick(4), mouth = pick(4), blush = pick(3) === 0;
  const eye = cx => [
    `<circle cx="${cx}" cy="${ey}" r="3.3" ${W}/>`,
    `<ellipse cx="${cx}" cy="${ey}" rx="2.7" ry="4.1" ${W}/>`,
    `<path d="M${cx - 4} ${ey + 1.5}q4-5.5 8 0" ${L}/>`,
    `<path d="M${cx - 3.5} ${ey}h7" ${L}/>`,
  ][eyes];
  const mouths = [
    `<path d="M24 ${my}q8 7 16 0" ${L}/>`,
    `<path d="M23 ${my - 1}q9 11 18 0z" ${W}/>`,
    `<path d="M28.5 ${my}q3.5 3.5 7 0" ${L}/>`,
    `<path d="M27 ${my + 1}q5 3 10 0" ${L}/>`,
  ];
  // Each face gets its own gradient id: a face in a hidden menu does not
  // render its gradient, so a later face must not point to it.
  const id = 'f' + h.toString(36) + '-' + (++faceSeq);
  const art = `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">`
    + `<stop offset="0" stop-color="hsl(${hue} 70% ${66 - deep}%)"/><stop offset="1" stop-color="hsl(${hue2 % 360} 64% ${50 - deep}%)"/></linearGradient></defs>`
    + `<circle cx="32" cy="32" r="32" fill="url(#${id})"/>`
    + (blush ? `<g fill="#fff" opacity=".22"><circle cx="${32 - gap - 6}" cy="${ey + 9}" r="4"/><circle cx="${32 + gap + 6}" cy="${ey + 9}" r="4"/></g>` : '')
    + eye(32 - gap) + eye(32 + gap) + mouths[mouth] + '</svg>';
  return `<span class="face" style="--s:${size}px">${art}</span>`;
}
// whenWords writes the time line of a chat: "Today 5:38 PM", a weekday
// in the last week, and a date before that.
function whenWords(ts) {
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
  const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  const day = days === 0 ? 'Today' : days === 1 ? 'Yesterday' : days < 7 ? d.toLocaleDateString([], {weekday: 'long'})
    : d.toLocaleDateString([], {month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric'});
  return `<b>${esc(day)}</b> ${esc(time)}`;
}
const isPicture = mt => /^image\/(png|jpeg|gif|webp|bmp)$/.test(mt || '');
// attHTML shows the files of a user message: each image as a picture, and

/* ---------- attachments of the next message ---------- */
const MAX_FILES = 20, MAX_FILE_BYTES = 32e6;
// prepare reads a file for sending. A photo over 2 MB becomes a JPEG of at
// most 2048 pixels on its long side, as Messages sends it.
async function prepare(file) {
  let blob = file, name = file.name || 'file';
  if (/^image\/(png|jpeg|webp)$/.test(file.type) && file.size > 2e6 && 'createImageBitmap' in window) {
    try {
      const img = await createImageBitmap(file);
      const k = Math.min(1, 2048 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const out = await new Promise(r => c.toBlob(r, 'image/jpeg', .88));
      if (out && out.size < file.size) { blob = out; name = name.replace(/\.[^.]*$/, '') + '.jpg'; }
    } catch (e) { /* send the original */ }
  }
  const data = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('The file ' + name + ' could not be read.'));
    r.readAsDataURL(blob);
  });
  return {name, type: blob.type || file.type, size: blob.size, data};
}
async function addFiles(files) {
  for (const file of files) {
    if (S.attach.length >= MAX_FILES) throw new Error('A message holds at most ' + MAX_FILES + ' files.');
    const f = await prepare(file);
    if (S.attach.reduce((n, x) => n + x.size, f.size) > MAX_FILE_BYTES) throw new Error('The files of a message hold at most 32 MB.');
    S.attach.push(f);
    draft.saveFiles(S.draft);
    drawTray();
  }
}
// drawTray shows the files of the next message in its message bar.
function drawTray() {
  const t = $('#tray');

  t.innerHTML = S.attach.map((f, i) => {
    const x = `<button type="button" class="x" data-action="unattach" data-i="${i}" aria-label="Remove ${esc(f.name)}">${svg.x}</button>`;
    return isPicture(f.type) ? `<div class="chip"><img alt="${esc(f.name)}" src="data:${esc(f.type)};base64,${f.data}">${x}</div>`
      : `<div class="chip file-chip">${svg.doc}<span><b>${esc(f.name)}</b><small>${esc(bytes(f.size))}</small></span>${x}</div>`;
  }).join('');
  const f = t.closest('form');
  if (f && $('[data-send]', f)) $('[data-send]', f).disabled = !canSend(f);
}

// fileRow puts one changed file in the card of its steps. A file that the

function fileRow(id, box, it) {

// abilityGroups sorts what an agent can do by verdict: on its own, asks
// first, the control plane decides, and cannot.
function abilityGroups(all) {
  const groups = [['allow', 'On its own'], ['ask', 'Asks you first'], ['external', 'Your control plane decides'], ['deny', 'Cannot']];
  return groups.map(([v, title]) => ({title, rows: (all || []).filter(x => x.verdict === v || (v === 'deny' && x.verdict === 'none'))})).filter(g => g.rows.length);
}
// abilities says what an agent can do, in the groups of its verdicts. A
// pattern rule, such as "Never runs git push*", is the second line.
function abilities(all) {
  const html = abilityGroups(all).map(g => `<p class="sub">${g.title}</p><div class="group">${g.rows.map(x => `<div class="row can"><span class="main"><span>${esc(x.text)}</span>${(x.notes || []).map(n => `<span class="s">${esc(n)}</span>`).join('')}</span></div>`).join('')}</div>`).join('');
  return html ? `<h2 class="sec">What it can do</h2>${html}` : '';
}
// skillList names the skills that an agent can load, from the catalog of

function skillList(sk) {

// fillDraft checks a proposal on the server and draws it as the contact card

async function fillDraft(el) {

    + (lim ? `<p class="k">Limits</p><ul><li>${esc(cap(lim))}</li></ul>` : '') + '</div>'
    + `<div class="do">${made ? `<button class="btn primary" data-action="start" data-agent="${esc(d.name)}">Start run</button><button class="btn" data-action="agent" data-name="${esc(d.name)}">Open agent</button>`
      : `<button class="btn primary" data-action="create-draft">${d.exists ? 'Replace ' + esc(d.name) : 'Create agent'}</button>`}</div>`;

// limits words a budget: working time, turns, tokens, tool calls, and cost.
function limits(b) {
  if (!b) return '';

  const time = ns => { const m = Math.round(ns / 6e10); return m < 1 ? plural(Math.max(1, Math.round(ns / 1e9)), 'second') : m < 120 ? plural(m, 'minute') : plural(Math.round(m / 60), 'hour'); };
  return [b.deadline > 0 && time(b.deadline) + ' of work', b.maxTurns && plural(b.maxTurns, 'turn'), b.maxTokens && plural(b.maxTokens, 'token'),
    b.maxToolCalls && plural(b.maxToolCalls, 'tool call'), b.maxCostUSD && '$' + b.maxCostUSD.toFixed(2)].filter(Boolean).join(', ');
}

// connect is where a link to connect a service lands, from the chat, a
// home row, or an MCP host: #connect/<server>/<run>. The person taps
// Connect, signs in at the service, and comes back to the run, or to
// Connected. A run that waits for the service also offers Skip.
screens.connect = {
  async open(s, el, dir) {
    const server = s.id, runId = s.member || '';
    if (!person()) {
      mount(el, bar(s, '', true) + `<div class="solo"><span class="mark">${svg.link}</span><h1 class="large">Connect ${esc(server)}</h1>
        <p class="lede">Only a signed-in person can connect a service. Sign in with your own account, then open this link again.</p></div>`, dir);
      return;
    }
    const [all, res] = await Promise.all([api.connections(), runId ? api.result(runId).catch(() => null) : null]);
    if (top() !== s) return;
    const c = all.find(x => x.server === server);
    if (!c) {
      mount(el, bar(s, '', true) + alert() + `<div class="solo"><span class="mark">${svg.link}</span><h1 class="large">Connect ${esc(server)}</h1>
        <p class="lede">No service named ${esc(server)} acts as you here.</p><button class="btn wide" data-action="go" data-view="connections">Connections</button></div>`, dir);
      return;
    }
    const title = connectTitle(c);
    const p = res && res.pending && res.pending.connect && res.pending.connect.server === server ? res.pending : null;
    const agent = res ? res.agent : '';
    s.title = 'Connect ' + title;
    if (c.connected && !p) {
      mount(el, bar(s, '', true) + alert() + `<div class="solo"><span class="mark ok">${svg.done}</span><h1 class="large">${esc(title)} is connected</h1>
        <p class="lede">${esc(c.account ? 'Your agents act as ' + c.account + ' there.' : 'Your agents act as you there.')}</p>
        ${runId ? `<button class="btn primary wide" data-action="run" data-id="${esc(runId)}">Open the run</button>` : '<button class="btn primary wide" data-action="nav" data-view="home">Done</button>'}</div>`, dir);
      return;
    }
    const expired = p && p.connect.reason === 'expired';
    const lede = p && agent ? (expired ? `${agent} needs your sign-in at ${title} to go on acting as you there.` : `${agent} wants to act as you in ${title}.`)
      : `Let your agents act as you in ${title}.`;
    mount(el, bar(s, '', true) + alert() + `<div class="solo"><span class="mark">${svg.link}</span>
      <h1 class="large">${esc(expired ? 'Sign in to ' + title + ' again' : 'Connect ' + title)}</h1><p class="lede">${esc(lede)} You sign in at ${esc(title)}.</p>
      <button class="btn primary wide" data-action="connect" data-server="${esc(server)}" data-run="${esc(runId)}">Connect</button>
      ${p ? `<button class="btn plain wide" data-action="skip" data-id="${esc(runId)}" data-approval="${esc(p.id)}" data-back="1">Skip</button>` : ''}
      <p class="hint">You can disconnect it at any time in Connections.</p></div>`, dir);
  },
};

// connected is where a connection comes back to when no run waits for it.
screens.connected = {

/* ---------- actions ---------- */
// save hands a file of the run to the person as a download. Inside an MCP
// host the frame can block downloads, and the page cannot see that, so it
// says what to do then.
function save(blob, name, el) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  const scr = el && el.closest('.screen');
  if (S.mode === 'mcp' && scr && !$('.dl-note', scr)) {
    $('.path', scr).insertAdjacentHTML('afterend', '<p class="dl-note" role="status">If no download starts, this host blocks downloads, and this screen stays the way to read the file.</p>');
  }
}
// busy disables a button while its action runs.
async function busy(el, fn) {
  el.disabled = true;
  try { return await fn(); } finally { if (el.isConnected) el.disabled = false; }
}
const actions = {
  back,
  dismiss: () => { S.error = ''; document.querySelectorAll('.alert').forEach(a => a.remove()); },
  retry: () => { S.error = ''; show(); },
  go: d => go(d.view, {}),
  nav: d => { S.error = ''; go(d.view, {}); },
  menu: (d, el) => openMenu(el),
  'pick-agent': d => {
    S.agent = {name: d.name, member: d.member || ''};
    store.set('fw.agent', S.agent);
    closeMenus();
    drawChip();
    const t = $('form[data-form="intent"] textarea'); if (t) t.focus();
  },
  run: d => go('run', {id: d.id}),
  file: d => go('file', {id: d.id, path: d.path}),
  download: (d, el) => busy(el, async () => save(await api.download(d.id, d.path), d.path.split('/').pop(), el)),
  attach: (d, el) => { const i = $('input[name="pick"]', el.closest('form')); if (i) i.click(); },
  unattach: d => { S.attach.splice(+d.i, 1); draft.saveFiles(S.draft); drawTray(); },
  agent: d => go('agent', {name: d.name, member: d.member || ''}),
  start: d => go('start', {agent: d.agent || '', member: d.member || ''}),
  edit: d => go('edit', {name: d.name || ''}),
  earlier: (d, el) => busy(el, () => screens.run.older(S.run)),
  'to-decision': toDecision,
  // connect opens the connection of a service. From a run, the person
  // comes back to that run.
  connect: (d, el) => busy(el, () => openConnect(d.server, d.next || (d.run ? '#run/' + d.run : ''), el)),
  // skip lets a run go on without the service that it waits for.
  skip: (d, el) => busy(el, async () => {
    await api.decide(d.id, d.approval, 'deny');
    if (d.back) return go('run', {id: d.id}, 'replace');
    if (S.run) {
      S.run.decided = d.approval;
      screens.run.decision(S.run, null);
      S.run.idle = false;
      S.run.poll().catch(() => {});
    }
  }),
  disconnect: (d, el) => busy(el, async () => { await api.disconnect(d.server); show(); }),
  next: (d, el) => {
    const ctx = S.run;
    if (!ctx) return;
    switch (d.kind) {
      case 'review': {
        // One changed file opens. Several files come into view.
        const all = ctx.el.querySelectorAll('#outcome .file');
        if (all.length === 1) return go('file', {id: ctx.id, path: all[0].dataset.path});
        if (all.length) { all[0].scrollIntoView({block: 'center', behavior: smooth()}); all[0].focus({preventScroll: true}); }
        return;
      }
      case 'reply': { const t = $('#composer textarea', ctx.el); if (t) t.focus(); return; }
      case 'save-agent': return busy(el, async () => go('run', {id: runIdOf(await api.builder({fromRun: ctx.id}))}));
      case 'retry': return busy(el, async () => go('run', {id: runIdOf(await api.start(clean({agent: ctx.run.agent, input: ctx.run.input, member: ctx.run.member})))}));
    }
    toDecision();
  },
  'create-draft': async (d, el) => {
    const card = el.closest('.draft');
    await busy(el, () => api.putAgent(JSON.parse(card.dataset.profile)));
    agentsChanged();
    await fillDraft(card);
  },
  // Sign out forgets the token. The server then answers 401, and the page
  // shows the sign-in screen that the server offers.
  signout: () => { native.clearToken(); S.me = null; S.next = location.hash; boot().catch(fail); },
  cancel: async (d, el) => { el.disabled = true; await api.cancel(d.id); if (S.run) { S.run.idle = false; S.run.poll().catch(() => {}); } },
  delete: async (d, el) => {
    if (!el.dataset.armed) { el.dataset.armed = '1'; $('.t', el).textContent = 'Tap again to delete ' + d.name; return; }
    await api.deleteAgent(d.name);
    S.members = null;
    go('agents');
  },
};
const forms = {
  // A pasted token opens the screen that the person came from.
  token: f => {
    native.setToken(f.token.value.trim());
    S.error = '';
    S.tokenTry = true;
    const n = S.next || nextStore.get();
    history.replaceState(null, '', location.pathname + (n && n !== '#home' ? n : ''));
    return boot();
  },
  intent: async f => {
    const input = f.content.value.trim();
    const a = chosen();
    if (!input || !a) return;
    const files = S.attach.map(x => ({name: x.name, data: x.data}));
    const run = await api.start(clean({agent: a.name, input, files: files.length ? files : undefined, member: a.member}));
    store.set('fw.agent', {name: a.name, member: a.member});
    draft.clear('home');
    S.attach = draft.files('home');
    go('run', {id: runIdOf(run)});
  },
  send: async f => {
    const content = f.content.value.trim();
    const files = S.attach.map(x => ({name: x.name, data: x.data}));
    if (!content && !files.length) return;
    await api.send(f.dataset.id, content, files);
    f.content.value = '';
    f.content.style.height = '';
    draft.clear(f.dataset.draft);
    S.attach = draft.files(f.dataset.draft);
    drawTray();
    if (S.run) { S.run.idle = false; S.run.poll().catch(() => {}); }
  },
  decide: async (f, b) => {
    const decision = b && b.value === 'deny' ? 'deny' : 'allow';
    const raw = f.note ? f.note.value.trim() : '';
    let note = raw, content;
    if (f.dataset.question && decision === 'allow' && raw) {
      try { const o = JSON.parse(raw); if (o && typeof o === 'object') { content = o; note = ''; } } catch (e) { /* plain text goes in the note */ }
    }
    // A choice button answers with its value. A form answers with its fields.
    if (decision === 'allow' && b && b.dataset.pick) content = {[b.dataset.key]: JSON.parse(b.dataset.pick)};
    else if (decision === 'allow' && f.querySelector('[data-key]')) {
      content = {};
      for (const el of f.querySelectorAll('[data-key]')) {
        const k = el.dataset.key, t = el.dataset.type;
        if (el.type === 'checkbox') content[k] = el.checked;
        else if (el.value.trim() === '') continue;
        else if (el.tagName === 'SELECT') content[k] = JSON.parse(el.value);
        else content[k] = t === 'number' || t === 'integer' ? Number(el.value) : el.value;
      }
    }
    if (b && b.value === 'rule') await api.allowRule(f.dataset.id, f.dataset.approval, note || undefined);
    else await api.decide(f.dataset.id, f.dataset.approval, decision, note || undefined, content);
    if (S.run) {
      S.run.decided = f.dataset.approval;
      screens.run.decision(S.run, null);
      S.run.idle = false;
      S.run.poll().catch(() => {});
    }
  },
  create: async f => {
    const run = await api.builder({input: f.input.value.trim()});
    draft.clear('create');
    S.stack.pop();
    go('run', {id: runIdOf(run)});
  },
  start: async f => {
    const run = await api.start(clean({agent: f.agent.value, input: f.input.value.trim(), instructions: f.instructions.value.trim(), member: f.member.value}));
    S.stack.pop();
    go('run', {id: runIdOf(run)});
  },
  edit: async f => {
    let more = {};
    if (f.more.value.trim()) { try { more = JSON.parse(f.more.value); } catch (e) { throw new Error('The JSON under Advanced is not valid: ' + e.message); } }
    const p = Object.assign({}, more, clean({name: f.name.value.trim(), description: f.description.value.trim(), model: f.model.value.trim(), effort: f.effort.value, timeZone: f.timeZone.value.trim(), system: f.system.value}));
    const tools = list(f.tools.value); if (tools.length) p.tools = tools;
    const skills = f.skills.value.trim(); if (skills.toLowerCase() === 'none') p.skills = []; else if (skills) p.skills = list(skills);
    const access = {owners: list(f.owners.value), operators: list(f.operators.value), viewers: list(f.viewers.value)};
    if (access.owners.length || access.operators.length || access.viewers.length) p.access = access;
    const saved = await api.putAgent(p);
    agentsChanged();
    S.stack.pop();
    if (f.dataset.new) go('agent', {name: saved.name}); else show('pop');
  },
};
document.addEventListener('click', ev => {
  if (!ev.target.closest('.pop')) closeMenus();
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  ev.preventDefault();
  S.kbd = ev.detail === 0; // a click from Enter or Space
  const fn = actions[el.dataset.action];
  if (fn) Promise.resolve(fn(el.dataset, el)).catch(fail);
});

/* ---------- the keyboard ---------- */
// ITEMS are the rows that the arrow keys and j and k move between.
const ITEMS = '.row[data-action]:not([disabled]), .file[data-action], .hand[data-action], .menu > button:not([disabled])';
const shown = n => n.getClientRects().length > 0;
// moveFocus moves the focus to the next or the previous row of the list
// that has it: a menu, the side pane, or the screen. With no row in focus,
// the first row of the side pane, else of the screen, takes it.
function moveFocus(el, dir) {
  const inList = el && el.matches && el.matches(ITEMS);
  // A heading or the page itself has no row, so the open row, else the
  // first row, is where the move starts.
  if (!inList && el.matches && el.matches('a, button, input, select, textarea, summary, [tabindex]:not([tabindex="-1"])')) return false;
  const scope = inList ? el.closest('.menu') || el.closest('.side, .detail') : (S.wide && $('#side .screen')) || $('#detail .screen');
  const items = scope ? [...scope.querySelectorAll(ITEMS)].filter(shown) : [];
  if (!items.length) return false;
  const from = inList ? el : $('.row.sel', scope);
  const n = from ? items[items.indexOf(from) + dir] : items[dir > 0 ? 0 : items.length - 1];
  if (n) { n.focus(); n.scrollIntoView({block: 'nearest'}); }
  return true;
}
// focusComposer puts the focus in the composer of home, and opens home
// first when the composer is not on the screen.
function focusComposer() {
  const t = $('form[data-form="intent"] textarea');
  if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); return; }
  S.focusComposer = true;
  go('home', {});
}
document.addEventListener('keydown', ev => {
  const el = ev.target, plain = !ev.metaKey && !ev.ctrlKey && !ev.altKey;
  const open = $('.menu:not([hidden])');
  if (ev.key === 'Escape' && open) {
    const b = open.previousElementSibling;
    closeMenus();
    if (b) b.focus();
    return;
  }
  // Cmd or Ctrl+Enter sends a message, starts work, or submits the form.
  if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && el.form) {
    ev.preventDefault();
    if (!$('[data-send]', el.form) || canSend(el.form)) el.form.requestSubmit();
    return;
  }
  if (el.name === 'content' && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); if (canSend(el.form)) el.form.requestSubmit(); return; }
  // Escape leaves a text field, so the keys of the lists work again.
  if (el.matches('input, textarea, select, [contenteditable]')) { if (ev.key === 'Escape') el.blur(); return; }
  // The arrow keys open a menu from its button and move in the menu.
  if (open && el.matches('[data-action="menu"]') && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) {
    ev.preventDefault();
    const items = [...open.querySelectorAll('button')];
    if (items.length) items[ev.key === 'ArrowDown' ? 0 : items.length - 1].focus();
    return;
  }
  if (plain && ev.key === '/') { ev.preventDefault(); focusComposer(); return; }
  if (plain && ['ArrowDown', 'ArrowUp', 'j', 'k'].includes(ev.key)) {
    if (moveFocus(el, ev.key === 'ArrowDown' || ev.key === 'j' ? 1 : -1)) ev.preventDefault();
    return;
  }
  if (ev.key === 'Escape' && S.stack.length > 1) back();
});
// A menu closes when the focus leaves it.
document.addEventListener('focusout', ev => {
  const pop = ev.target.closest && ev.target.closest('.pop');
  if (!pop || pop.contains(ev.relatedTarget)) return;
  const m = $('.menu:not([hidden])', pop);
  if (m) { m.hidden = true; m.previousElementSibling.setAttribute('aria-expanded', 'false'); }
});
// Typing keeps the draft of its place and marks a decision form as edited,
// so a poll leaves the form alone.
function edited(ev) {
  const el = ev.target, f = el.form;
  if (!f) return;
  if (f.dataset.form === 'decide') f.dataset.dirty = '1';
  if (f.dataset.draft && (el.name === 'content' || el.name === 'input')) draft.saveText(f.dataset.draft, el.value);
  if (el.name !== 'content') return;
  grow(el);
  const b = $('[data-send]', f); if (b) b.disabled = !canSend(f);
}
document.addEventListener('input', edited);
// Activity reads its lines when the person opens it.
document.addEventListener('toggle', ev => { if (ev.target.id === 'activity' && ev.target.open) activity(ev.target).catch(fail); }, true);
// Files reach a message bar from the + button, a paste, or a drop.
document.addEventListener('paste', ev => {
  const files = [...((ev.clipboardData && ev.clipboardData.files) || [])];
  if (ev.target.name !== 'content' || !files.length) return;
  ev.preventDefault();
  addFiles(files).catch(fail);
});
const dragged = ev => [...((ev.dataTransfer && ev.dataTransfer.types) || [])].includes('Files');
document.addEventListener('dragover', ev => {
  const c = $('#composer');
  if (!c || !dragged(ev)) return;
  ev.preventDefault();
  c.classList.add('drop');
});
document.addEventListener('dragleave', ev => { if (!ev.relatedTarget && $('#composer')) $('#composer').classList.remove('drop'); });
document.addEventListener('drop', ev => {
  const c = $('#composer');
  if (!c || !dragged(ev)) return;
  ev.preventDefault();
  c.classList.remove('drop');
  addFiles([...ev.dataTransfer.files]).catch(fail);
});
document.addEventListener('submit', ev => {
  const f = ev.target;
  const fn = forms[f.dataset.form];
  if (!fn) return;
  ev.preventDefault();
  const btns = [...f.querySelectorAll('button[type=submit]'), ...(f.id ? document.querySelectorAll(`button[form="${f.id}"]`) : [])];
  btns.forEach(b => { b.disabled = true; });
  Promise.resolve(fn(f, ev.submitter)).catch(fail).finally(() => btns.forEach(b => { b.disabled = b.hasAttribute('data-send') && !canSend(f); }));
});
document.addEventListener('change', ev => {
  const f = ev.target.form;
  if (f && f.dataset.form === 'decide') f.dataset.dirty = '1';
  if (ev.target.name !== 'pick') return;
  const files = [...ev.target.files];
  ev.target.value = '';
  addFiles(files).catch(fail);
});
// Scrolling up to Load earlier loads the earlier messages.
let lastY = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY, up = y < lastY;
  lastY = y;
  const ctx = S.run, e = ctx && $('#earlier', ctx.el);
  if (!up || !e || e.hidden || ctx.loadingOlder) return;
  const r = e.getBoundingClientRect();
  if (r.bottom > 0 && r.top < window.innerHeight) screens.run.older(ctx).catch(fail);
}, {passive: true});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.refresh) S.refresh().catch(() => {}); });
window.matchMedia('(min-width: 960px)').addEventListener('change', () => { if (S.booted) show(); });

/* ---------- the host ---------- */
function applyHost(ctx) {
  if (!ctx) return;
  if (ctx.theme === 'light' || ctx.theme === 'dark') document.documentElement.dataset.theme = ctx.theme;
  // Inline, the page fits its content. Fullscreen and pip keep the window.
  if (ctx.displayMode) document.documentElement.dataset.mode = ctx.displayMode;
  const v = ctx.styles && ctx.styles.variables;
  if (v && v['--font-sans']) document.documentElement.style.setProperty('--font', v['--font-sans']);
}
// The result of the dashboard tool opens the screen that its view names.
// Only that tool names the page, so the host shows the page once. Usage is
// no screen any more, so its view opens home.
function applyResult(res) {
  const d = res && res.structuredContent;
  if (!d || !d.view) return;
  if (d.whoami) S.me = d.whoami;
  S.booted = true;
  if (d.view === 'run' && d.run) return go('run', {id: d.run.id}, 'replace');
  if (d.view === 'agent' && d.agent) return go('agent', {name: d.agent.name}, 'replace');
  if (d.view === 'agents') return go('agents');
  go('home');
}
bridge.on('ui/notifications/tool-input', () => {});
bridge.on('ui/notifications/tool-result', applyResult);
bridge.on('ui/notifications/tool-cancelled', p => fail(new Error('The host canceled the call. ' + (p.reason || ''))));
bridge.on('ui/notifications/host-context-changed', applyHost);
bridge.on('ui/resource-teardown', () => { stop(); return {}; });
bridge.on('ping', () => ({}));
function watchSize() {
  if (!('ResizeObserver' in window)) return;
  let last = '', t = null;
  const send = () => {
    const w = document.documentElement.scrollWidth, h = document.documentElement.scrollHeight;
    if (w + 'x' + h === last) return;
    last = w + 'x' + h;
    bridge.notify('ui/notifications/size-changed', {width: w, height: h});
  };
  new ResizeObserver(() => { clearTimeout(t); t = setTimeout(send, 120); }).observe(document.body);
}

/* ---------- boot ---------- */
// In a browser, the address keeps the screen: #run/<id>, #agent/<name>,
// #agents. A link or a pasted address that changes it opens that screen. An
// old link to a screen that is gone, such as #usage, opens home. The page
// sets the address with replaceState, which fires no hashchange.
function fromHash() {
  let [view, key, member] = location.hash.slice(1).split('/').map(decodeURIComponent);
  if (view === 'fleet' || view === 'operator') view = 'home';
  if (PLACES.includes(view)) S.stack = [{view}];
  else if (view === 'agent' || view === 'edit') S.stack = [{view: 'agents'}, {view, name: key, member}];
  else if (!screens[view] || ['signin', 'file', 'compose'].includes(view)) S.stack = [{view: 'home'}];
  else S.stack = [{view: 'home'}, {view, id: key, name: key, member}];
}
window.addEventListener('hashchange', () => { if (S.mode === 'native' && S.booted) { fromHash(); show(); } });
async function boot() {
  stop();
  if (!S.mode) {
    S.mode = 'native';
    if (window.parent && window.parent !== window) {
      try {
        const r = await bridge.request('ui/initialize', {protocolVersion: '2026-01-26', appInfo: {name: 'fw', version: '2'},
          appCapabilities: {availableDisplayModes: ['inline', 'fullscreen']}}, 2000);
        S.mode = 'mcp';
        api = mcp;
        applyHost(r && r.hostContext);
        bridge.notify('ui/notifications/initialized', {});
        watchSize();
      } catch (e) { /* not inside a host: the native API */ }
    }
  }
  try { S.me = await api.whoami(); S.tokenTry = false; nextStore.set(''); } catch (e) {
    if (e.signin && S.mode === 'native') return toSignin(e);
    S.error = e.message;
  }
  S.members = null;
  if (S.mode === 'native') { fromHash(); S.booted = true; return show(); }
  // Inside a host, the tool result that opened the page picks the screen.
  setTimeout(() => { if (!S.booted) { S.booted = true; show(); } }, 1200);
}
boot().catch(fail);
})();
